<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Online</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/node-vibrant/3.1.6/vibrant.min.js"></script>
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- =========================================
         HEADER
    ========================================== -->
    <header class="header">
        <div id="header-bg"></div>

        <img id="logo" class="logo" alt="Logo da Loja" crossorigin="anonymous">
        <h1 id="store-name">Carregando...</h1>
        
        <div id="loja-status-msg" class="status-loja"></div>
    </header>


    <!-- =========================================
         VITRINE DE PRODUTOS (DINÂMICA VIA API)
    ========================================== -->
    <main id="products" class="products">
        <!-- 
            Os produtos são inseridos aqui via main.js
            Estrutura esperada de cada produto:

            <div class="product-card">

                <div class="product-card-top">
                    <img class="product-img">

                    <div class="product-info">
                        <h3></h3>
                        <p></p>
                        <div class="product-price"></div>
                    </div>
                </div>

                <button class="btn-add">Adicionar</button>

            </div>
        -->
    </main>


    <!-- =========================================
         CARRINHO FLUTUANTE
    ========================================== -->
    <button class="cart-float" onclick="Cart.toggle()">
        🛒 Ver Carrinho  
        <span id="cart-total-float">R$ 0,00</span>
    </button>


    <!-- =========================================
         MODAL DO CARRINHO
    ========================================== -->
    <div id="cart-modal" class="cart-modal hidden">
        <div class="cart-box">
            <h2>Seu Pedido</h2>
            
            <button onclick="Cart.clear()" class="btn-clear-cart" 
                style="width: 100%; margin-bottom: 15px; padding: 8px; background: #fff1f1; color: #d9534f; border: 1px solid #d9534f; border-radius: 8px; cursor: pointer; font-weight: bold;">
                🗑️ Limpar Carrinho
            </button>

            <div id="cart-items"></div>
            
            <div class="cart-total">
                Total: <span id="cart-total"><strong>R$ 0,00</strong></span>
            </div>
            
            <button id="btn-finalizar-cart" onclick="Cart.checkout()" class="btn-primary">
                Finalizar Pedido
            </button>

            <button onclick="Cart.toggle()" class="btn-secondary">
                Fechar
            </button>
        </div>
    </div>


    <!-- =========================================
         MODAL CHECKOUT
    ========================================== -->
    <div id="checkout-modal" class="checkout-modal hidden">
        <div class="checkout-box">
            <h2>Finalizar Pedido</h2>
            
            <div class="form-group">
                <label>Seu Nome</label>
                <input id="cliente-nome" placeholder="Ex: João Silva">
            </div>

            <!-- CAMPO DE BAIRRO ATUALIZADO -->
            <div class="form-group">
                <label>Seu Bairro</label>
                <input type="text" id="cliente-bairro" placeholder="Digite seu bairro..." oninput="Cart.identificarBairro(this.value)">
                <small id="taxa-status" style="margin-top: 5px; font-size: 0.8rem; color: #666;"></small>
            </div>

            <div class="form-group">
                <label>Endereço Completo</label>
                <input id="cliente-endereco" placeholder="Rua, número e ponto de referência">
            </div>

            <div class="form-group">
                <label>Forma de Pagamento</label>
                <select id="cliente-pagamento">
                    <option value="">Escolha como pagar</option>
                    <option value="Pix">Pix</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Cartão">Cartão</option>
                </select>
            </div>

            <div class="form-group">
                <label>Observações (Opcional)</label>
                <textarea id="cliente-obs" placeholder="Ex: Sem cebola, trocar troco para R$ 50..."></textarea>
            </div>

            <button id="btn-enviar-whatsapp" onclick="Cart.sendOrder()" class="btn-primary">
                🚀 Enviar Pedido para o WhatsApp
            </button>
            
            <button onclick="Cart.closeCheckout()" class="btn-secondary">
                Voltar
            </button>
        </div>
    </div>


    <!-- =========================================
         SCRIPTS
    ========================================== -->
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
